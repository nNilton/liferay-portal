components:
    schemas:
        Issue:
            properties:
                description:
                    type: string
                id:
                    type: string
                key:
                    type: string
                name:
                    type: string
                priority:
                    type: string
info:
    description:
        "A Java client JAR is available for use with the group ID 'com.liferay', artifact ID
        'com.liferay.jira.integration.rest.client', and version '1.0.1'."
    license:
        name: "Apache 2.0"
        url: "http://www.apache.org/licenses/LICENSE-2.0.html"
    title: ""
    version: v1.0
openapi: 3.0.1
paths:
    "/issue/{siteId}/{issueId}":
        get:
            operationId: getIssue
            parameters:
                - in: path
                  name: siteId
                  required: true
                  schema:
                      format: int64
                      type: integer
                - in: path
                  name: issueId
                  required: true
                  schema:
                      type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Issue"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Issue"
            tags: ["Issue"]